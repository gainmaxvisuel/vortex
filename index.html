<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a2540">
  <title>Créer un compte | Vortex</title>
  <link rel="icon" href="logo.png">
  <style>
    :root{
      --navy:#0a2540;
      --navy-2:#0f3057;
      --navy-3:#143d6e;
      --accent:#0a2540;
      --bg:#f3f5f9;
      --card:#ffffff;
      --line:#d9e0ea;
      --text:#14213a;
      --muted:#65738a;
      --danger:#b42335;
      --danger-bg:#fdecee;
      --ok:#146c43;
      --ok-bg:#e8f5ee;
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}

    /* Bannière : logo petit au centre (type écran), côtés colorés dans une seule teinte */
    .hero{width:100%;height:170px;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,var(--navy-3) 0%,var(--navy) 50%,var(--navy-3) 100%);border-bottom:3px solid var(--navy-3)}
    .screen{height:108px;max-width:70%;padding:7px;border-radius:14px;background:#fff;border:1px solid #c7d3e3;box-shadow:0 10px 28px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center}
    .screen img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block;border-radius:8px}

    .wrap{width:100%;max-width:460px;margin:-26px auto 0;padding:0 14px 32px;position:relative}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 26px;box-shadow:0 12px 36px rgba(10,37,64,.10)}
    h1{font-size:22px;line-height:1.25;margin:0 0 6px;text-align:center;font-weight:700;letter-spacing:-.2px}
    .sub{font-size:13.5px;color:var(--muted);text-align:center;margin:0 0 26px}
    .field{margin:16px 0}
    label{display:block;font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:7px}
    .opt{color:var(--muted);font-weight:400}
    input,select{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);padding:0 13px;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
    input:focus,select:focus{border-color:var(--navy-3);box-shadow:0 0 0 3px rgba(20,61,110,.14)}
    input::placeholder{color:#9aa7ba}
    .passrow{display:flex;gap:8px}
    .passrow input{flex:1;min-width:0}
    .show{border:1px solid var(--line);border-radius:10px;background:#f3f5f9;color:var(--navy-2);padding:0 13px;font-size:12px;font-weight:600;cursor:pointer}
    .show:hover{background:#e9edf4}
    .captcha-row{display:flex;gap:10px;align-items:center}
    .captcha-image{width:150px;height:50px;flex:0 0 150px;object-fit:contain;border-radius:8px;background:#edf2f7;border:1px solid var(--line)}
    .refresh{height:44px;width:44px;flex:0 0 44px;border-radius:10px;border:1px solid var(--line);background:#f3f5f9;color:var(--navy-2);font-size:19px;cursor:pointer}
    .refresh:hover{background:#e9edf4}
    .captcha-row input{min-width:0}
    .hint{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.45}
    .tag{display:inline-block;font-size:10.5px;color:var(--ok);background:var(--ok-bg);border:1px solid #bfe3cf;border-radius:20px;padding:2px 9px;margin-left:6px;font-weight:600}
    .btn{width:100%;border:0;border-radius:10px;height:48px;margin-top:10px;background:var(--navy);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
    .btn:hover{background:var(--navy-3)}
    .btn:disabled{opacity:.6;cursor:wait}
    .msg{display:none;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.5;margin:16px 0 0;overflow-wrap:anywhere}
    .msg.error{display:block;color:var(--danger);background:var(--danger-bg);border:1px solid #f3c3c9}
    .msg.success{display:block;color:var(--ok);background:var(--ok-bg);border:1px solid #bfe3cf}
    .divider{height:1px;background:var(--line);margin:24px 0 18px}
    .login-btn{display:block;width:100%;text-align:center;padding:13px;border-radius:10px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-size:14px;font-weight:600;text-decoration:none;transition:background .15s,color .15s}
    .login-btn:hover{background:var(--navy);color:#fff}
    .legal{font-size:11px;line-height:1.55;color:var(--muted);text-align:center;margin:18px 8px 0}
    @media(max-width:390px){.hero{height:140px}.screen{height:88px}.card{padding:24px 16px}.captcha-row{gap:7px}.captcha-image{width:120px;flex-basis:120px}.refresh{width:40px;flex-basis:40px}}
  </style>
</head>
<body>
  <header class="hero">
    <div class="screen"><img src="logo.png" alt="Vortex"></div>
  </header>

  <main class="wrap">
    <section class="card">
      <h1>Créer un compte</h1>
      <p class="sub">Inscrivez-vous pour rejoindre Vortex</p>
      <form id="registerForm" novalidate>
        <div class="field">
          <label for="country">Pays</label>
          <select id="country" name="country" required disabled>
            <option value="">Chargement des pays…</option>
          </select>
        </div>
        <div class="field">
          <label for="phone">Numéro de téléphone</label>
          <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Ex. 70123456" required maxlength="18">
          <div class="hint">Saisissez le numéro associé au pays sélectionné.</div>
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <div class="passrow"><input id="password" name="password" type="password" autocomplete="new-password" placeholder="8 caractères minimum" required minlength="8" maxlength="128"><button class="show" type="button" data-toggle="password">Afficher</button></div>
        </div>
        <div class="field">
          <label for="password_confirmation">Confirmer le mot de passe</label>
          <div class="passrow"><input id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" placeholder="Répétez le mot de passe" required minlength="8" maxlength="128"><button class="show" type="button" data-toggle="password_confirmation">Afficher</button></div>
        </div>
        <div class="field">
          <label for="referral_code">Code de parrainage <span id="refInfo" class="opt">(facultatif)</span></label>
          <input id="referral_code" name="referral_code" type="text" maxlength="5" autocomplete="off" placeholder="Code à 5 caractères">
        </div>
        <div class="field">
          <label>Vérification de sécurité</label>
          <div class="captcha-row">
            <img id="captchaImage" class="captcha-image" alt="Code CAPTCHA" hidden>
            <button class="refresh" id="refreshCaptcha" type="button" aria-label="Renouveler le CAPTCHA" title="Renouveler le CAPTCHA">↻</button>
            <input id="captcha_answer" name="captcha_answer" type="text" placeholder="Code affiché" maxlength="5" autocomplete="off" autocapitalize="characters" required>
          </div>
          <div class="hint">Recopiez les 5 caractères de l’image. Le code expire après 5 minutes.</div>
        </div>
        <button class="btn" id="submitBtn" type="submit">Créer mon compte</button>
        <div id="message" class="msg" role="status" aria-live="polite"></div>
      </form>
      <div class="divider"></div>
      <a class="login-btn" href="connexion.html">Déjà un compte ? Se connecter</a>
    </section>
    <p class="legal">Vos informations sont transmises à Vortex via une fonction serveur sécurisée.</p>
  </main>
<script>
(() => {
  "use strict";
  const API = "https://pjsfamxyftxzmjeywbgh.supabase.co/functions/v1/vortex-auth";
  const $ = (id) => document.getElementById(id);
  let captchaId = null;
  let countryLoadFailed = false;

  function showMessage(text, kind) {
    const box = $("message");
    box.textContent = text;
    box.className = "msg " + kind;
  }
  async function callApi(payload) {
    const response = await fetch(API, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "Une erreur est survenue.");
    return data;
  }

  // Code de parrainage rempli automatiquement depuis le lien d'invitation
  function detectReferral() {
    const params = new URLSearchParams(location.search);
    let code = params.get("ref") || params.get("code") || params.get("parrain") || params.get("referral") || params.get("invite") || "";
    code = code.trim().toLowerCase().slice(0, 5);
    try {
      if (code) localStorage.setItem("vortex_ref", code);
      else code = localStorage.getItem("vortex_ref") || "";
    } catch (e) {}
    return code;
  }
  const refCode = detectReferral();
  if (refCode) {
    $("referral_code").value = refCode;
    $("refInfo").className = "";
    $("refInfo").innerHTML = '<span class="tag">Invitation appliquée</span>';
  }

  async function loadCountries() {
    const select = $("country");
    select.disabled = true;
    select.innerHTML = '<option value="">Chargement des pays…</option>';
    try {
      const data = await callApi({action:"countries"});
      const countries = Array.isArray(data.countries) ? data.countries : [];
      select.innerHTML = "";
      if (!countries.length) {
        select.innerHTML = '<option value="">Aucun pays disponible</option>';
        throw new Error("Aucun pays n’est actuellement autorisé. Contactez l’administrateur.");
      }
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "Sélectionnez votre pays";
      select.appendChild(placeholder);
      countries.forEach((country) => {
        const option = document.createElement("option");
        option.value = country.code;
        option.textContent = country.name + " (" + country.currency + ")";
        select.appendChild(option);
      });
      select.disabled = false;
      const preferred = new URLSearchParams(location.search).get("pays");
      if (preferred && countries.some(c => c.code === preferred.toUpperCase())) select.value = preferred.toUpperCase();
    } catch (error) {
      countryLoadFailed = true;
      select.innerHTML = '<option value="">Impossible de charger les pays</option>';
      showMessage(error.message || "Impossible de charger la liste des pays.", "error");
    }
  }
  async function loadCaptcha() {
    $("refreshCaptcha").disabled = true;
    $("captchaImage").hidden = true;
    $("captcha_answer").value = "";
    try {
      const data = await callApi({action:"captcha"});
      captchaId = data.captcha_id;
      $("captchaImage").src = data.captcha_image;
      $("captchaImage").hidden = false;
    } catch (error) {
      captchaId = null;
      showMessage(error.message || "Impossible de charger le CAPTCHA.", "error");
    } finally {
      $("refreshCaptcha").disabled = false;
    }
  }
  $("refreshCaptcha").addEventListener("click", loadCaptcha);
  document.querySelectorAll("[data-toggle]").forEach(button => {
    button.addEventListener("click", () => {
      const input = $(button.dataset.toggle);
      const visible = input.type === "text";
      input.type = visible ? "password" : "text";
      button.textContent = visible ? "Afficher" : "Masquer";
    });
  });
  $("registerForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const btn = $("submitBtn");
    if (countryLoadFailed || !$("country").value) {
      showMessage("Sélectionnez un pays disponible avant de continuer.", "error");
      return;
    }
    if ($("password").value !== $("password_confirmation").value) {
      showMessage("Les deux mots de passe ne correspondent pas.", "error");
      return;
    }
    if (!captchaId) {
      showMessage("Le CAPTCHA n’est pas prêt. Renouvelez-le puis réessayez.", "error");
      return;
    }
    btn.disabled = true;
    btn.textContent = "Création du compte…";
    try {
      const result = await callApi({
        action:"register",
        country:$("country").value,
        phone:$("phone").value.trim(),
        password:$("password").value,
        password_confirmation:$("password_confirmation").value,
        referral_code:$("referral_code").value.trim().toLowerCase(),
        captcha_id:captchaId,
        captcha_answer:$("captcha_answer").value.trim().toLowerCase()
      });
      try { localStorage.removeItem("vortex_ref"); } catch (e) {}
      showMessage("Compte créé avec succès. Bonus de bienvenue : " +
        new Intl.NumberFormat("fr-FR").format(result.wallet?.balance ?? 0) + " " +
        (result.wallet?.currency || "") + ".", "success");
      $("registerForm").reset();
      $("country").value = "";
      $("refInfo").className = "opt";
      $("refInfo").textContent = "(facultatif)";
      await loadCaptcha();
    } catch (error) {
      showMessage(error.message || "L’inscription a échoué. Réessayez.", "error");
      await loadCaptcha();
    } finally {
      btn.disabled = false;
      btn.textContent = "Créer mon compte";
    }
  });
  loadCountries();
  loadCaptcha();
})();
</script>
</body>
                                 </html>
