<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102653"><title>Missions de parrainage | VORTEX"><style>:root{--navy:#102653;--blue:#1769e8;--ink:#182b4d;--muted:#70809a;--bg:#f4f7fc;--line:#e3eaf5}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,Arial,sans-serif;color:var(--ink)}header{background:linear-gradient(120deg,#0c1e45,#18366d);color:white;padding:18px;display:flex;align-items:center;gap:14px}header a{color:white;text-decoration:none;font-size:14px;border:1px solid #ffffff50;border-radius:10px;padding:9px 12px}header h1{font-size:19px;margin:0}main{max-width:700px;margin:auto;padding:16px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:14px;box-shadow:0 5px 14px #10265308}.muted{color:var(--muted);font-size:13px}.big{font-size:27px;font-weight:800;color:#175ed1;margin:8px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.reward{font-weight:750;white-space:nowrap}.status{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}.btn{display:inline-block;background:#1769e8;color:white;text-decoration:none;border-radius:10px;padding:12px 15px;font-weight:700;font-size:14px}</style></head><body><header><a href="moi-vortex.html">Retour</a><h1>Mission de parrainage</h1></header><main><section class="card"><div class="muted">Personnes invitées directement (niveau 1)</div><div class="big" id="invites">Chargement…</div><div class="muted">Investisseurs directs : <strong id="investors">—</strong></div><div class="status" id="status">Vérification des données du compte…</div></section><section class="card"><h2 style="font-size:17px;margin:0 0 5px">Récompenses selon les investisseurs du niveau 1</h2><div class="muted">La récompense dépend du nombre de filleuls directs ayant acheté au moins un produit.</div><div id="milestones"></div><div class="status">Les récompenses ci-dessous correspondent aux règles configurées dans la base VORTEX. Le statut de paiement de chaque palier doit être confirmé par l’historique des récompenses du compte.</div></section></main><script>const BASE='https://pjsfamxyftxzmjeywbgh.supabase.co/functions/v1/';const token=()=>sessionStorage.getItem('vortex_session_token');async function api(payload){const r=await fetch(BASE+'vortex-actions',{method:'POST',headers:{'Content-Type':'application/json',...(token()?{Authorization:'Bearer '+token()}:{})},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'Erreur de chargement');return d}const tiers=[{n:5,r:900},{n:10,r:1500},{n:20,r:4000},{n:50,r:10000},{n:100,r:25000},{n:200,r:60000}];function money(n,c){return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(n)+' '+c}document.getElementById('milestones').innerHTML=tiers.map(t=>`<div class="row"><div><strong>${t.n} investisseurs directs</strong><div class="muted">Palier niveau 1</div></div><div class="reward">${money(t.r,'XOF / XAF')}</div></div>`).join('');(async()=>{const st=document.getElementById('status');if(!token()){st.textContent='Session absente. Connectez-vous pour consulter vos missions.';document.getElementById('invites').textContent='—';return}try{const d=await api({action:'referral_summary'});document.getElementById('invites').textContent=String(d.direct_invites||0);document.getElementById('investors').textContent=String(d.direct_investors||0);const c=d.currency||'XOF';document.getElementById('milestones').innerHTML=tiers.map(t=>`<div class="row"><div><strong>${t.n} investisseurs directs</strong><div class="muted">Palier niveau 1</div></div><div class="reward">${money(t.r,c)}</div></div>`).join('');st.textContent='Données chargées depuis le compte VORTEX.'}catch(e){st.textContent='Impossible de charger les données. Reconnectez-vous puis réessayez.';document.getElementById('invites').textContent='—'}})();</script></body></html>
