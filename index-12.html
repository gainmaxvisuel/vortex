<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4a5260">
  <title>Inscription | Vortex</title>
  <style>
    :root{
      --top:#4a5260;
      --mid:#2c3441;
      --bottom:#eef0f4;
      --text:#1c2432;
      --muted:#8b94a3;
      --line:#dfe3ea;
      --btn:#424a58;
      --danger:#b42335;
      --danger-bg:#fdecee;
      --ok:#146c43;
      --ok-bg:#e8f5ee;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0}
    body{min-height:100vh;color:var(--text);font-family:Roboto,Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;background:linear-gradient(180deg,var(--top) 0%,var(--mid) 34%,var(--mid) 40%,#9097a4 66%,var(--bottom) 88%,var(--bottom) 100%) fixed}
    .page{width:100%;max-width:480px;margin:0 auto;padding:0 14px 28px;min-height:100vh;display:flex;flex-direction:column}

    .hero{height:36vh;min-height:210px;display:flex;align-items:center;justify-content:center}
    .brand{margin:0;font-size:clamp(54px,17vw,84px);font-weight:900;letter-spacing:-2px;line-height:1;color:#fff;text-shadow:0 6px 18px rgba(0,0,0,.35)}

    .card{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:56px;margin-bottom:13px;display:flex;align-items:center;padding:0 14px;gap:12px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
    .card:focus-within{border-color:#7a8496;box-shadow:0 0 0 3px rgba(74,82,96,.18)}
    .card input{flex:1;min-width:0;height:54px;border:0;outline:0;background:transparent;font-size:16px;color:var(--text);font-family:inherit}
    .card input::placeholder{color:var(--muted)}
    .ico{flex:0 0 auto;width:24px;height:24px;color:#2a313e;display:block}

    /* Sélecteur pays : drapeau + indicatif, <select> natif par-dessus */
    .cc{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px 0 8px;border-radius:21px;background:#f1f2f6}
    .cc img{width:26px;height:26px;border-radius:50%;object-fit:cover;background:#d9dde5;display:block}
    .cc .dial{font-size:16px;font-weight:700;color:var(--text)}
    .cc .chev{width:16px;height:16px;color:#3a4352}
    .cc select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}

    .eye{flex:0 0 auto;width:34px;height:34px;border:0;background:transparent;padding:0;cursor:pointer;color:#2a313e;display:grid;place-items:center}
    .eye svg{width:24px;height:24px;display:block}
    .eye .slash{opacity:0;transition:opacity .12s}
    .eye.on .slash{opacity:1}

    .captcha-img{width:120px;height:44px;flex:0 0 120px;object-fit:contain;border-radius:7px;background:#edf2f7;border:1px solid var(--line)}
    .refresh{flex:0 0 auto;width:38px;height:38px;border:0;border-radius:50%;background:#f1f2f6;color:#2a313e;cursor:pointer;display:grid;place-items:center}
    .refresh svg{width:19px;height:19px}

    .refhint{display:none;font-size:12px;color:var(--ok);margin:-6px 4px 12px;font-weight:600}
    .btn{width:100%;height:60px;border:0;border-radius:30px;background:var(--btn);color:#fff;font-size:22px;font-weight:700;font-family:inherit;margin-top:6px;cursor:pointer;box-shadow:0 8px 20px rgba(30,36,48,.28)}
    .btn:disabled{opacity:.6;cursor:wait}
    .msg{display:none;padding:12px 14px;border-radius:10px;font-size:13.5px;line-height:1.5;margin:14px 0 0;overflow-wrap:anywhere}
    .msg.error{display:block;color:var(--danger);background:var(--danger-bg);border:1px solid #f3c3c9}
    .msg.success{display:block;color:var(--ok);background:var(--ok-bg);border:1px solid #bfe3cf}
    .login{display:block;text-align:center;margin:26px 0 0;font-size:19px;color:#1c2432;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
    .spacer{flex:1}
  </style>
</head>
<body>
  <div class="page">
    <header class="hero"><h1 class="brand">VORTEX</h1></header>

    <form id="registerForm" novalidate autocomplete="on">
      <div class="card">
        <label class="cc" for="country">
          <img id="flag" alt="" hidden>
          <span class="dial" id="dial">+—</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          <select id="country" name="country" aria-label="Pays" required disabled>
            <option value="">Chargement…</option>
          </select>
        </label>
        <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Entrez le numéro de téléphone" required maxlength="18">
      </div>

      <div class="card">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5" fill="currentColor"/><path d="M8 10.5V7.5a4 4 0 0 1 7.6-1.7"/></svg>
        <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Entrez le mot de passe" required minlength="8" maxlength="128">
        <button class="eye" type="button" data-toggle="password" aria-label="Afficher le mot de passe">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16" stroke-width="2.4"/></svg>
        </button>
      </div>

      <div class="card">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5" fill="currentColor"/><path d="M8 10.5V7.5a4 4 0 0 1 7.6-1.7"/></svg>
        <input id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" placeholder="Saisissez de nouveau le mot de passe" required minlength="8" maxlength="128">
        <button class="eye" type="button" data-toggle="password_confirmation" aria-label="Afficher le mot de passe">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16" stroke-width="2.4"/></svg>
        </button>
      </div>

      <div class="card">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg>
        <input id="referral_code" name="referral_code" type="text" maxlength="5" autocomplete="off" placeholder="Code d’invitation (facultatif)">
      </div>
      <div class="refhint" id="refHint">Invitation appliquée</div>

      <div class="card">
        <img id="captchaImage" class="captcha-img" alt="CAPTCHA" hidden>
        <button class="refresh" id="refreshCaptcha" type="button" aria-label="Renouveler le CAPTCHA">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.6 4.5L20 16"/><path d="M20 20v-4h-4"/></svg>
        </button>
        <input id="captcha_answer" name="captcha_answer" type="text" placeholder="Code de l’image" maxlength="5" autocomplete="off" autocapitalize="characters" required>
      </div>

      <button class="btn" id="submitBtn" type="submit">S'inscrire</button>
      <div id="message" class="msg" role="status" aria-live="polite"></div>
    </form>

    <a class="login" href="connexion.html">Aller à la connexion &gt;</a>
    <div class="spacer"></div>
  </div>

<script>
(() => {
  "use strict";
  const API = "https://pjsfamxyftxzmjeywbgh.supabase.co/functions/v1/vortex-auth";
  const $ = (id) => document.getElementById(id);
  const DIAL = {BF:"226",CI:"225",ML:"223",SN:"221",TG:"228",BJ:"229",NE:"227",GN:"224",CM:"237",GA:"241",CG:"242",CD:"243",GH:"233",NG:"234",MA:"212",DZ:"213",TN:"216",TD:"235",MR:"222",GM:"220",SL:"232",LR:"231",GW:"245",CV:"238",RW:"250",BI:"257",MG:"261",KM:"269",DJ:"253",EG:"20",KE:"254",TZ:"255",UG:"256",ZA:"27",CF:"236",GQ:"240",HT:"509",FR:"33",BE:"32",CH:"41",LU:"352",DE:"49",GB:"44",ES:"34",IT:"39",PT:"351",CA:"1",US:"1"};
  let captchaId = null;
  let countryLoadFailed = false;
  let countries = [];

  function showMessage(text, kind) {
    const box = $("message");
    box.textContent = text;
    box.className = "msg " + kind;
  }
  async function callApi(payload) {
    const response = await fetch(API, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "Une erreur est survenue.");
    return data;
  }

  function dialOf(c) {
    const raw = c.dial_code || c.phone_code || c.dialCode || c.calling_code || DIAL[String(c.code).toUpperCase()] || "";
    return raw ? "+" + String(raw).replace(/^\+/, "") : "";
  }
  function updatePill() {
    const code = $("country").value;
    const c = countries.find(x => x.code === code);
    const flag = $("flag");
    if (c) {
      $("dial").textContent = dialOf(c) || "+—";
      flag.src = "https://flagcdn.com/w80/" + String(c.code).toLowerCase() + ".png";
      flag.hidden = false;
      flag.onerror = () => { flag.hidden = true; };
    } else {
      $("dial").textContent = "+—";
      flag.hidden = true;
    }
  }
  $("country").addEventListener("change", updatePill);

  // Code d'invitation rempli automatiquement depuis le lien (?ref=CODE)
  function detectReferral() {
    const params = new URLSearchParams(location.search);
    let code = params.get("ref") || params.get("code") || params.get("parrain") || params.get("referral") || params.get("invite") || "";
    code = code.trim().toLowerCase().slice(0, 5);
    try {
      if (code) localStorage.setItem("vortex_ref", code);
      else code = localStorage.getItem("vortex_ref") || "";
    } catch (e) {}
    return code;
  }
  const refCode = detectReferral();
  if (refCode) {
    $("referral_code").value = refCode;
    $("refHint").style.display = "block";
  }

  async function loadCountries() {
    const select = $("country");
    select.disabled = true;
    try {
      const data = await callApi({action:"countries"});
      countries = Array.isArray(data.countries) ? data.countries : [];
      select.innerHTML = "";
      if (!countries.length) {
        select.innerHTML = '<option value="">Aucun pays</option>';
        throw new Error("Aucun pays n’est actuellement autorisé. Contactez l’administrateur.");
      }
      countries.forEach((country) => {
        const option = document.createElement("option");
        option.value = country.code;
        option.textContent = country.name + " (" + country.currency + ")" + (dialOf(country) ? " " + dialOf(country) : "");
        select.appendChild(option);
      });
      select.disabled = false;
      const preferred = (new URLSearchParams(location.search).get("pays") || "").toUpperCase();
      select.value = countries.some(c => c.code === preferred) ? preferred : countries[0].code;
      updatePill();
    } catch (error) {
      countryLoadFailed = true;
      select.innerHTML = '<option value="">Erreur</option>';
      showMessage(error.message || "Impossible de charger la liste des pays.", "error");
    }
  }
  async function loadCaptcha() {
    $("refreshCaptcha").disabled = true;
    $("captchaImage").hidden = true;
    $("captcha_answer").value = "";
    try {
      const data = await callApi({action:"captcha"});
      captchaId = data.captcha_id;
      $("captchaImage").src = data.captcha_image;
      $("captchaImage").hidden = false;
    } catch (error) {
      captchaId = null;
      showMessage(error.message || "Impossible de charger le CAPTCHA.", "error");
    } finally {
      $("refreshCaptcha").disabled = false;
    }
  }
  $("refreshCaptcha").addEventListener("click", loadCaptcha);

  // Œil : un clic affiche le mot de passe et barre l'œil, un autre clic retire le trait
  document.querySelectorAll("[data-toggle]").forEach(button => {
    button.addEventListener("click", () => {
      const input = $(button.dataset.toggle);
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      button.classList.toggle("on", show);
    });
  });

  $("registerForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const btn = $("submitBtn");
    if (countryLoadFailed || !$("country").value) {
      showMessage("Sélectionnez un pays disponible avant de continuer.", "error");
      return;
    }
    if ($("password").value !== $("password_confirmation").value) {
      showMessage("Les deux mots de passe ne correspondent pas.", "error");
      return;
    }
    if (!captchaId) {
      showMessage("Le CAPTCHA n’est pas prêt. Renouvelez-le puis réessayez.", "error");
      return;
    }
    btn.disabled = true;
    btn.textContent = "Création du compte…";
    try {
      const result = await callApi({
        action:"register",
        country:$("country").value,
        phone:$("phone").value.trim(),
        password:$("password").value,
        password_confirmation:$("password_confirmation").value,
        referral_code:$("referral_code").value.trim().toLowerCase(),
        captcha_id:captchaId,
        captcha_answer:$("captcha_answer").value.trim().toLowerCase()
      });
      try { localStorage.removeItem("vortex_ref"); } catch (e) {}
      showMessage("Compte créé avec succès. Bonus de bienvenue : " +
        new Intl.NumberFormat("fr-FR").format(result.wallet?.balance ?? 0) + " " +
        (result.wallet?.currency || "") + ".", "success");
      const keep = $("country").value;
      $("registerForm").reset();
      $("country").value = keep;
      $("refHint").style.display = "none";
      document.querySelectorAll(".eye").forEach(b => b.classList.remove("on"));
      updatePill();
      await loadCaptcha();
    } catch (error) {
      showMessage(error.message || "L’inscription a échoué. Réessayez.", "error");
      await loadCaptcha();
    } finally {
      btn.disabled = false;
      btn.textContent = "S'inscrire";
    }
  });
  loadCountries();
  loadCaptcha();
})();
</script>
</body>
</html>
