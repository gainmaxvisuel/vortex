<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historique des transactions — VORTEX</title><style>
:root{--blue:#0877c9;--bg:#f3f6fa;--text:#182230;--muted:#6b7787;--line:#dce3eb;--green:#217346;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}header{height:62px;background:var(--blue);color:#fff;display:flex;align-items:center;gap:14px;padding:0 17px;box-shadow:0 2px 8px #0001}.back{width:34px;height:34px;display:grid;place-items:center;color:#fff;text-decoration:none;border-radius:50%}.back svg{width:24px;height:24px}header h1{font-size:18px;margin:0;font-weight:700}main{max-width:760px;margin:18px auto;padding:0 12px 28px}.summary{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:14px}.summary .label{font-size:13px;color:var(--muted)}.summary .value{font-size:20px;font-weight:700;margin-top:6px}.filters{display:flex;gap:8px;overflow:auto;margin:0 0 13px}.filter{border:1px solid var(--line);background:#fff;color:#344054;border-radius:8px;padding:10px 13px;white-space:nowrap;font-size:13px}.filter.active{background:var(--blue);border-color:var(--blue);color:#fff}#list{display:grid;gap:11px}.transaction{background:#fff;border:1px solid #dfe4ea;border-radius:10px;padding:13px 14px;box-shadow:0 1px 2px #00003}.top,.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.top{padding-bottom:10px;border-bottom:1px dotted var(--line)}.kind{font-weight:700;font-size:15px}.amount{font-weight:700;font-size:15px;text-align:right}.row{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.row:last-child{border-bottom:0;padding-bottom:0}.key{color:var(--muted)}.val{text-align:right;overflow-wrap:anywhere;max-width:66%}.status{font-weight:700}.status.success{color:var(--green)}.status.pending{color:#9a6700}.status.failed{color:var(--red)}.message{background:#fff;border:1px solid var(--line);border-radius:10px;text-align:center;color:var(--muted);padding:28px 14px}.error{color:var(--red)}.small{font-size:12px;color:var(--muted);margin-top:7px}@media(min-width:600px){main{margin-top:24px}.transaction{padding:16px 18px}}
</style></head><body><header><a class="back" href="dashboard.html" aria-label="Retour au tableau de bord"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a><h1>Historique des transactions</h1></header><main><section class="summary"><div class="label">Transactions récentes</div><div class="value" id="count">Chargement…</div><div class="small" id="currency-note">Historique du compte connecté</div></section><nav class="filters" aria-label="Filtrer les transactions"><button class="filter active" data-filter="all">Toutes</button><button class="filter" data-filter="deposit">Recharges</button><button class="filter" data-filter="withdraw">Retraits</button><button class="filter" data-filter="income">Revenus et commissions</button><button class="filter" data-filter="other">Autres</button></nav><section id="list"><div class="message">Chargement de l’historique…</div></section></main><script>
(()=>{const API='https://pjsfamxyftxzmjeywbgh.supabase.co/functions/v1/vortex-actions',list=document.getElementById('list'),count=document.getElementById('count'),currencyNote=document.getElementById('currency-note');let transactions=[],filter='all';const money=(n,c)=>`${Number(n||0).toLocaleString('fr-FR',{maximumFractionDigits:2})} ${c||'XOF'}`;const date=s=>{if(!s)return'Indisponible';const d=new Date(s);return Number.isNaN(d.getTime())?'Indisponible':d.toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'medium'})};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const label=t=>{const v=String(t||'').toLowerCase();if(/deposit|recharge|depot/.test(v))return'Recharge';if(/withdraw|retrait|payout/.test(v))return'Retrait';if(/income|earning|revenu|daily/.test(v))return'Revenu';if(/referral|commission|parrain/.test(v))return'Commission';if(/purchase|buy|achat|product/.test(v))return'Achat de produit';if(/gift|cadeau/.test(v))return'Cadeau';if(/checkin|pointage/.test(v))return'Pointage';return t?String(t).replace(/[_-]+/g,' ').replace(/\b\w/g,m=>m.toUpperCase()):'Transaction'};const cat=t=>{const v=String(t.type||'').toLowerCase();if(/deposit|recharge|depot/.test(v))return'deposit';if(/withdraw|retrait|payout/.test(v))return'withdraw';if(/income|earning|revenu|daily|referral|commission|parrain/.test(v))return'income';return'other'};const stat=s=>{const v=String(s||'').toLowerCase();if(/success|completed|complete|approved|paid|réussi|termine/.test(v))return['Succès','success'];if(/pending|attente|processing|en cours/.test(v))return['En attente','pending'];if(/fail|reject|cancel|échec|refus/.test(v))return['Échec','failed'];return[s||'Non précisé','']};function row(k,v){return`<div class="row"><span class="key">${k}</span><span class="val">${v}</span></div>`}function render(){const visible=transactions.filter(t=>filter==='all'||cat(t)===filter);count.textContent=`${visible.length} transaction${visible.length>1?'s':''}`;if(!visible.length){list.innerHTML='<div class="message">Aucune transaction à afficher pour ce filtre.</div>';return}list.innerHTML=visible.map(t=>{const[s,c]=stat(t.status);return`<article class="transaction"><div class="top"><div class="kind">${esc(label(t.type))}</div><div class="amount">${money(t.amount,t.currency)}</div></div>${row('Numéro de commande',esc(t.professional_transaction_id||t.id||'—'))}${row('Description',esc(t.description||label(t.type)))}${row('Solde après opération',money(t.balance_after,t.currency))}${row('État',`<span class="status ${c}">${esc(s)}</span>`)}${row('Temps',esc(date(t.created_at)))}</article>`}).join('')}document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));filter=b.dataset.filter;render()}));async function load(){const token=localStorage.getItem('vortex_session_token');if(!token){list.innerHTML='<div class="message error">Session introuvable. Connectez-vous pour consulter votre historique.</div>';count.textContent='—';return}try{const response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'my_transactions'})}),data=await response.json();if(!response.ok)throw new Error(data.error||'Impossible de charger les transactions.');transactions=Array.isArray(data.items)?data.items:[];const user=JSON.parse(localStorage.getItem('vortex_user')||'{}'),currency=user.currency||(user.country==='CM'?'XAF':'XOF');currencyNote.textContent=`Devise du compte : ${currency}`;render()}catch(e){list.innerHTML=`<div class="message error">${esc(e.message||'Erreur de chargement. Réessayez.')}</div>`;count.textContent='—'}}load()})();
</script></body></html>
